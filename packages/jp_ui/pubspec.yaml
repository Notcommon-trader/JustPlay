name: jp_ui
description: JustPlay design system — tokens, themed widgets, motion, and the game shell.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  jp_core: ^0.1.0
  # Only for SoundService. The dependency direction is the one ARCHITECTURE.md
  # already records — jp_ui sits above jp_framework — and routing sound through
  # GameSession is what gives all ten games audio from a single change instead of
  # ten hand-wired boards.
  jp_framework: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
