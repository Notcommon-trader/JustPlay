name: jp_monetization
description: Consent, entitlements and advertising, behind ports the app can run without.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  jp_framework: ^0.1.0

# No vendor SDK yet, on purpose. AdMob and RevenueCat cannot initialise without
# real account identifiers and a Firebase project, and adding the dependencies
# before those exist means a package that compiles but can never be exercised.
# The ports here are complete and tested; each adapter is one file when the
# credentials arrive.

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
