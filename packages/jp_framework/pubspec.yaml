name: jp_framework
description: Platform services shared by every JustPlay app — storage, records, settings.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  jp_core: ^0.1.0
  # Key-value storage only. Everything the app persists today is a small
  # per-game record, and a database would be build tooling and generated code
  # bought against a need that has not arrived. The KeyValueStore port is what
  # makes swapping in Isar later a one-file change.
  path_provider: ^2.1.6
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
