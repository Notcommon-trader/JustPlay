name: timekiller
description: JustPlay — a collection of quick games to fill a spare few minutes.
publish_to: none

# version: <marketing>+<build number>. The build number must increase on every
# store upload; both stores reject a re-used one.
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  jp_core: ^0.1.0
  jp_framework: ^0.1.0
  jp_games: ^0.1.0
  jp_ui: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  uses-material-design: true
